<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>JenyClean</title>
<style>
  :root {
    --bg: #f4f5f8; --card: #ffffff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2f6fed; --accent-ink: #ffffff; --soft: #eaf0fe;
    --ok: #15803d; --ok-soft: #e7f6ec; --bad: #b91c1c; --bad-soft: #fdecec; --wait: #a16207; --wait-soft: #fdf6e3;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #1a1d23; --text: #eef0f3; --muted: #9aa1ad; --line: #2a2f37;
      --accent: #5b8cff; --accent-ink: #0b0d12; --soft: #1e2a45;
      --ok: #4ade80; --ok-soft: #14301f; --bad: #f87171; --bad-soft: #3a1717; --wait: #facc15; --wait-soft: #3a3214;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { padding: 8px 16px 100px; max-width: 560px; margin: 0 auto; }
  header { padding: 14px 16px 4px; max-width: 560px; margin: 0 auto; display: flex; justify-content: space-between; align-items: baseline; }
  header h1 { font-size: 20px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  h2 { font-size: 13px; margin: 18px 2px 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .card { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; border: 1px solid var(--line); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chips.scroll::-webkit-scrollbar { display: none; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 9px 14px; font-size: 15px; cursor: pointer; white-space: nowrap; font-family: inherit; }
  .chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chip small { opacity: .75; }
  label.f { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  label.f:first-child { margin-top: 0; }
  input[type=text], input[type=number], input[type=date], textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; outline: none; -webkit-appearance: none;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 15px; font: 600 17px/1 inherit; font-family: inherit;
         background: var(--accent); color: var(--accent-ink); cursor: pointer; margin-top: 16px; }
  .btn:disabled { opacity: .5; }
  .btn.ghost { background: var(--soft); color: var(--accent); }
  .btn.small { display: inline-block; width: auto; padding: 10px 14px; font-size: 15px; margin: 0; }
  .btn.ok { background: var(--ok); color: #fff; } .btn.bad { background: var(--bad-soft); color: var(--bad); }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .note { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--soft); font-size: 14px; }
  .toggle { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; margin-top: 14px; }
  .toggle .sw { width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: .15s; }
  .toggle .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .toggle.on .sw { background: var(--accent); } .toggle.on .sw::after { left: 21px; }
  .toggle b { display: block; } .toggle small { color: var(--muted); }
  .photo { display: flex; align-items: center; gap: 10px; }
  .photo img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; }
  .item { display: flex; gap: 10px; align-items: flex-start; }
  .item .ico { font-size: 20px; width: 28px; text-align: center; }
  .item .body { flex: 1; min-width: 0; }
  .top { display: flex; justify-content: space-between; gap: 8px; }
  .amt { font-weight: 600; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 13px; }
  .office { font-size: 13px; margin-top: 6px; padding: 6px 8px; border-radius: 8px; background: var(--soft); }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.no { background: var(--bad-soft); color: var(--bad); } .pill.wait { background: var(--wait-soft); color: var(--wait); }
  .del { border: 0; background: none; color: var(--muted); font-size: 18px; padding: 0 4px; cursor: pointer; }
  .sel { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .sel:last-child { border-bottom: 0; }
  .box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; flex: none; color: transparent; }
  .sel.on .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .tot { display: flex; justify-content: space-between; padding: 5px 0; }
  .per { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .per button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; width: 44px; height: 40px; font-size: 18px; }
  .per button:disabled { opacity: .3; }
  /* выплата */
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--line); border-radius: 12px; padding: 3px; gap: 3px; margin: 10px 0; }
  .seg button { border: 0; background: none; color: var(--text); padding: 9px 4px; border-radius: 9px; font: 600 14px inherit; font-family: inherit; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .hero { background: var(--accent); color: var(--accent-ink); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; }
  .hero .lbl { opacity: .85; font-size: 14px; } .hero .big { font-size: 32px; font-weight: 700; letter-spacing: -.01em; }
  .hero .sub2 { opacity: .85; font-size: 13px; margin-top: 2px; }
  .pl { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .pl:last-child { border-bottom: 0; }
  .pl .v { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 500; }
  .pl.total { font-weight: 700; } .pl.neg .v { color: var(--bad); }
  .stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat div { background: var(--bg); border-radius: 10px; padding: 8px; text-align: center; }
  .stat b { display: block; font-size: 18px; } .stat span { font-size: 12px; color: var(--muted); }
  .late { border-left: 4px solid var(--wait); }
  .late.good { border-left-color: var(--ok); }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
        display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav button { flex: 1; border: 0; background: none; color: var(--muted); padding: 9px 2px 10px; font-size: 11px; position: relative; font-family: inherit; }
  nav button .i { display: block; font-size: 21px; margin-bottom: 2px; }
  nav button.on { color: var(--accent); }
  nav .badge { position: absolute; top: 4px; left: 55%; background: var(--bad); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 84px; padding: 13px 16px; border-radius: 12px; background: var(--text); color: var(--bg);
           text-align: center; opacity: 0; transform: translateY(10px); transition: .2s; pointer-events: none; z-index: 9; }
  .toast.show { opacity: 1; transform: none; }
  .toast.err { background: var(--bad); color: #fff; }
  .asbar { max-width: 560px; margin: 4px auto 0; padding: 0 16px; }
  .asbar select { width: 100%; font: 600 15px inherit; font-family: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--wait); background: var(--wait-soft); color: var(--text); }
  .asnote { font-size: 12px; color: var(--wait); margin-top: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 8px; }
  .spin { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -3px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
</style>
</head>

<script>
(function () {

// Если страница размещена отдельно (GitHub Pages) — сюда адрес веб-приложения Apps Script (…/exec).

const TG = window.Telegram && window.Telegram.WebApp;
try { if (TG) { TG.ready(); TG.expand(); } } catch (e) { /* не в Telegram */ }
const KEY = /^<\?/.test(document.body.dataset.k || '') ? '' : document.body.dataset.k;
const L = (document.body.dataset.l === 'en' || (!KEY && TG && TG.initDataUnsafe && TG.initDataUnsafe.user && /^en/.test(TG.initDataUnsafe.user.language_code || ''))) ? 'en' : 'ru';

const TT = {

    addPhoto: '📷 Добавить фото', changePhoto: 'Заменить', save: 'Сохранить', saving: 'Сохраняю…', saved: 'Записано ✅',
    noClients: 'Уборок за этот день в таблице нет — впиши имя.', est: (v, r) => `≈ $${v} за доезд (${r}), после проверки офисом`,

    homeHint: 'Дорога из дома к первому клиенту и от последнего клиента домой не оплачивается.',
    autoPair: 'В этот день две уборки — клиенты выбраны сами.',

    onHand: 'На руках', nothingOnHand: 'На руках ничего нет 👌', pick: 'Отметь, что передаёшь', giveTo: 'Кому', giveDate: 'Когда передала',
    give: s => `Передать ${s}`, given: to => `Отмечено. Жду подтверждения от ${to}.`, notLinked: to => `${to} ещё не в боте — подтвердит офис.`,

    lateT: 'Опоздания за месяц', late: (n, m) => `${n} раз(а), всего ${m} мин`, noLate: 'Опозданий нет 👍', payEmpty: 'За этот период данных пока нет',
    nothingPending: 'Ничего не ждёт подтверждения 👌', handNobody: 'ни у кого', min: 'мин', err: 'Ошибка', retry: 'Повторить',
    need: 'Заполни', photoBig: 'Фото не загрузилось', office: 'Офис',
  },
  en: {
    tabAdd: 'Add', tabGive: 'Hand over', tabList: 'Expenses', tabPay: 'Pay', tabConfirm: 'Confirm', tabHand: 'On hand',
    date: 'Date', today: 'Today', yesterday: 'Yesterday', wd: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
    what: 'What', client: 'Client', clientPh: 'Or type the client name', pair: 'From → to', from: 'From (client)', to: 'To (client)',
    manual: 'Other', minutes: 'Minutes on the road (whole trip)', amount: 'Amount, $',
    cashType: 'Cash or check', whatBought: 'What did you buy', comment: 'Comment', commentPh: 'Optional', photo: 'Receipt photo',
    addPhoto: '📷 Add photo', changePhoto: 'Replace', save: 'Save', saving: 'Saving…', saved: 'Saved ✅',
    noClients: 'No cleanings found for this day — type the name.', est: (v, r) => `≈ $${v} travel pay (${r}), after office review`,
    r1099: f => `first ${f} min unpaid`, rW2: 'from the first minute', justAdded: 'Just added',
    homeHint: 'The trip from home to the first client and from the last client home is not paid.',
    autoPair: 'Two cleanings that day — clients picked automatically.',
    seaT: '🏙 Seattle', seaD: 'Trip to, from or within Seattle — all minutes at the Seattle rate',
    onHand: 'On hand', nothingOnHand: 'Nothing on hand 👌', pick: 'Tick what you are handing over', giveTo: 'To', giveDate: 'When',
    give: s => `Hand over ${s}`, given: to => `Done. Waiting for ${to} to confirm.`, notLinked: to => `${to} is not in the bot yet — the office will confirm.`,
    waiting: 'Waiting for confirmation', incoming: 'Handed to you', got: 'Got it', notGot: "Didn't get it",
    confirmed: 'Confirmed ✅', rejected: 'Marked as not received', cash: 'Cash', check: 'Check',
    totals: 'Period totals', reimb: 'Parking, tolls, supplies', travelPay: 'Travel pay', cashGot: 'Cash received', checkGot: 'Checks received',
    pendingN: 'Pending review', empty: 'No entries for this period', st: { ok: 'approved', no: 'rejected', wait: 'pending' },
    delQ: 'Delete this entry?', deleted: 'Deleted', delGone: 'Already reviewed — not deleting',
    month: 'Month', toPay: 'To be paid', ref: 'For reference', payNote: 'Numbers update once a day (in the morning).', noPay: 'Summary not available yet',
    lateT: 'Late arrivals this month', late: (n, m) => `${n} time(s), ${m} min total`, noLate: 'No late arrivals 👍', payEmpty: 'No data for this period yet',
    nothingPending: 'Nothing to confirm 👌', handNobody: 'nobody', min: 'min', err: 'Error', retry: 'Retry',
    need: 'Fill in', photoBig: 'Photo failed to load', office: 'Office',
  },
};
let T = TT[L];
const ICON = { parking: '🅿️', toll: '🛣', supplies: '🧴', travel: '🚗', cash: '💰', other: '•' };
const TICON = { cash: '💵', check: '🧾' };

// ── helpers
const $ = (sel, root) => (root || document).querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => { const v = Math.round(Number(n || 0) * 100) / 100; return v.toFixed(2).replace(/\.00$/, ''); };
const usd = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const short = iso => iso ? iso.slice(5).replace('-', '/') : '';
const wday = iso => { const p = iso.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay(); };
const isCheck = s => /чек|check/i.test(String(s));
let AS = '';   // админ: чей экран смотрим
function call(action, p) {
  p = Object.assign({}, p || {}, AS ? { as: AS } : {});
  if (!(window.google && google.script && google.script.run) && !STATIC_API) {
    return Promise.reject(new Error('Открой приложение из бота в Telegram (кнопка «Приложение»).'));
  }
  if (window.google && google.script && google.script.run) {
    return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(KEY, action, p || {}));
  }
  return fetch(STATIC_API, { method: 'POST', body: JSON.stringify({ api: action, p: p || {}, initData: TG ? TG.initData : '' }) })
    .then(r => r.text()).then(txt => {
      let o; try { o = JSON.parse(txt); } catch (e) { throw new Error('Сервер ответил не данными. Админу: в Apps Script запустите checkSetup.'); }
      if (o.err) throw new Error(o.err); return o.v;
    });
}
let toastTimer;
function toast(msg, err) {
  const el = $('#toast'); el.textContent = msg; el.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.className = 'toast' + (err ? ' err' : ''); }, err ? 4000 : 2200);
}
const errMsg = e => (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, '');
function loading() { $('#view').innerHTML = '<div class="empty"><span class="spin"></span></div>'; }
function failed(e, again) {
  $('#view').innerHTML = `<div class="empty">${esc(T.err)}: ${esc(errMsg(e))}<br><br><button class="btn small ghost" id="again">${T.retry}</button></div>`;
  $('#again').onclick = again;
}
function dateChips(days, cur, id) {
  const lbl = (iso, i) => i === 0 ? T.today : i === 1 ? T.yesterday : T.wd[wday(iso)];
  return `<div class="chips" id="${id}">` + days.map((iso, i) =>
    `<button class="chip ${iso === cur ? 'on' : ''}" data-d="${iso}">${lbl(iso, i)} <small>${short(iso)}</small></button>`).join('') +
    `</div><input type="date" id="${id}Pick" max="${days[0]}" value="${cur}" style="margin-top:8px">`;
}
function sumLine(items) {
  const c = items.filter(i => i.type === 'cash').reduce((s, i) => s + i.amount, 0);
  const k = items.filter(i => i.type === 'check').reduce((s, i) => s + i.amount, 0);
  return [c ? `${TICON.cash} $${money(c)}` : '', k ? `${TICON.check} $${money(k)}` : ''].filter(Boolean).join(' + ');
}
const itemLine = it => `${TICON[it.type] || ''} ${short(it.date)} · ${it.type === 'check' ? T.check : T.cash} $${money(it.amount)}${it.client ? ' · ' + it.client : ''}`;

// ── state
let S = null;
let tab = null;
const form = { date: null, cat: null, client: '', from: '', to: '', manual: false, auto: false, minutes: '', seattle: false, amount: '', cashType: '', comment: '', photo: null };
const added = [];
const resetForm = () => Object.assign(form, { cat: null, client: '', from: '', to: '', manual: false, auto: false, minutes: '', seattle: false, amount: '', cashType: '', comment: '', photo: null });

// ── navigation
function tabs() {
  return S.owner ? [['confirm', '📥', T.tabConfirm], ['hand', '👛', T.tabHand]]
    : [['add', '➕', T.tabAdd], ['give', '💸', T.tabGive], ['list', '📋', T.tabList], ['pay', '💵', T.tabPay]];
}
function renderNav() {
  const badge = S.pending && S.pending.length ? `<span class="badge">${S.pending.length}</span>` : '';
  $('#nav').innerHTML = tabs().map(([id, i, n]) =>
    `<button data-t="${id}" class="${id === tab ? 'on' : ''}"><span class="i">${i}</span>${n}${(id === 'give' || id === 'confirm') ? badge : ''}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.t));
}
function go(t) {
  tab = t; renderNav(); window.scrollTo(0, 0);
  ({ add: viewAdd, give: viewGive, list: viewList, pay: viewPay, confirm: viewConfirm, hand: viewOwnerHand })[t]();
}

// ═════ ➕ Добавить ═════
function clientsFor(date) {
  if (S.clients[date]) return Promise.resolve(S.clients[date]);
  return call('clients', { date: date }).then(r => (S.clients[date] = r.clients));
}
const pairsOf = cl => { const p = []; for (let i = 0; i + 1 < cl.length; i++) p.push([cl[i], cl[i + 1]]); return p; };

function viewAdd() {
  if (!form.date) form.date = S.today;
  const v = $('#view');
  const cat = S.cats.find(c => c.label === form.cat);
  const code = cat ? cat.code : null;
  let html = `<div class="card"><label class="f">${T.date}</label>${dateChips(S.days, form.date, 'dt')}`;
  html += `<label class="f">${T.what}</label><div class="chips" id="cats">` +
    S.cats.map(c => `<button class="chip ${c.label === form.cat ? 'on' : ''}" data-c="${esc(c.label)}">${ICON[c.code] || ''} ${esc(c.label)}</button>`).join('') + '</div></div>';
  if (code) html += `<div class="card" id="fields"><div class="empty" style="padding:8px"><span class="spin"></span></div></div>`;
  if (added.length) html += `<h2>${T.justAdded}</h2>` + added.slice(-5).reverse().map(a => `<div class="card">${esc(a)}</div>`).join('');
  v.innerHTML = html;

  const newDate = d => { form.date = d; form.client = form.from = form.to = ''; form.manual = form.auto = false; viewAdd(); };
  v.querySelectorAll('#dt .chip').forEach(b => b.onclick = () => newDate(b.dataset.d));
  $('#dtPick').onchange = e => { if (e.target.value && e.target.value <= S.today) newDate(e.target.value); };
  v.querySelectorAll('#cats .chip').forEach(b => b.onclick = () => {
    if (form.cat !== b.dataset.c) { form.cat = b.dataset.c; form.client = form.from = form.to = ''; form.manual = form.auto = false; }
    viewAdd();
  });
  if (code) clientsFor(form.date).then(cl => renderFields(code, cl)).catch(() => renderFields(code, []));
}

function renderFields(code, clients) {
  const box = $('#fields'); if (!box) return;
  let h = '';
  const amount = () => `<label class="f">${T.amount}</label><input type="text" inputmode="decimal" id="amount" value="${esc(form.amount)}" placeholder="0.00">`;
  const clientField = () => {
    let x = `<label class="f">${T.client}</label>`;
    if (clients.length) x += `<div class="chips" id="cl">` + clients.map(c => `<button class="chip ${c === form.client ? 'on' : ''}" data-v="${esc(c)}">${esc(c)}</button>`).join('') + '</div>';
    x += `<input type="text" id="client" placeholder="${clients.length ? T.clientPh : T.noClients}" value="${esc(clients.indexOf(form.client) >= 0 ? '' : form.client)}" style="margin-top:8px">`;
    return x;
  };
  // «Откуда → куда»: пары соседних уборок дня; если пара одна — ставим сами
  const pairField = () => {
    const pairs = pairsOf(clients);
    if (pairs.length === 1 && !form.manual && !form.from) { form.from = pairs[0][0]; form.to = pairs[0][1]; form.auto = true; }
    const manual = form.manual || !pairs.length;
    let x = `<label class="f">${T.pair}</label>`;
    if (pairs.length) x += `<div class="chips" id="pairs">` + pairs.map((p, i) =>
      `<button class="chip ${!form.manual && form.from === p[0] && form.to === p[1] ? 'on' : ''}" data-i="${i}">${esc(p[0])} → ${esc(p[1])}</button>`).join('') +
      `<button class="chip ${form.manual ? 'on' : ''}" id="man">✏️ ${T.manual}</button></div>`;
    if (form.auto && !form.manual) x += `<div class="hint">✨ ${T.autoPair}</div>`;
    if (manual) x += `<div class="row2" style="margin-top:8px"><input type="text" id="from" list="cll" placeholder="${T.from}" value="${esc(form.from)}"><input type="text" id="to" list="cll" placeholder="${T.to}" value="${esc(form.to)}"></div>` +
      `<datalist id="cll">${clients.map(c => `<option value="${esc(c)}">`).join('')}</datalist>`;
    return x;
  };
  const comment = () => `<label class="f">${T.comment}</label><input type="text" id="comment" placeholder="${T.commentPh}" value="${esc(form.comment)}">`;
  const photo = () => `<label class="f">${T.photo}</label><div class="photo">` +
    (form.photo ? `<img src="data:image/jpeg;base64,${form.photo.data}"><button class="btn small ghost" id="ph">${T.changePhoto}</button><button class="del" id="phx">✕</button>`
      : `<button class="btn small ghost" id="ph">${T.addPhoto}</button>`) + `<input type="file" id="phf" accept="image/*" class="hidden"></div>`;

  if (code === 'parking') h = clientField() + amount() + comment() + photo();
  else if (code === 'toll') h = pairField() + amount() + comment() + photo();
  else if (code === 'supplies') h = amount() + `<label class="f">${T.whatBought}</label><input type="text" id="comment" value="${esc(form.comment)}">` + photo();
  else if (code === 'cash') {
    h = clientField() + amount() + `<label class="f">${T.cashType}</label><div class="chips" id="ct">` +
      S.cashTypes.map(c => `<button class="chip ${c === form.cashType ? 'on' : ''}" data-v="${esc(c)}">${isCheck(c) ? TICON.check : TICON.cash} ${esc(c)}</button>`).join('') + '</div>' + comment() + photo();
  } else if (code === 'travel') {
    h = pairField() + `<div class="hint">🏠 ${T.homeHint}</div>` +
      `<label class="f">${T.minutes}</label><input type="number" inputmode="numeric" id="minutes" value="${esc(form.minutes)}" min="1" max="600">`;
    if (S.seattle) h += `<div class="toggle ${form.seattle ? 'on' : ''}" id="sea"><span class="sw"></span><span><b>${T.seaT}</b><small>${T.seaD}</small></span></div>`;
    h += `<div class="note hidden" id="est"></div>` + comment();
  }
  box.innerHTML = h + `<button class="btn" id="save">${T.save}</button>`;
  wire(code, clients);
}

function wire(code, clients) {
  const box = $('#fields');
  const again = () => renderFields(code, clients);
  box.querySelectorAll('#cl .chip').forEach(b => b.onclick = () => { form.client = b.dataset.v; $('#client').value = ''; box.querySelectorAll('#cl .chip').forEach(x => x.classList.toggle('on', x === b)); });
  const cl = $('#client'); if (cl) cl.oninput = () => { form.client = cl.value; box.querySelectorAll('#cl .chip').forEach(x => x.classList.remove('on')); };
  const pairs = pairsOf(clients);
  box.querySelectorAll('#pairs .chip[data-i]').forEach(b => b.onclick = () => { const p = pairs[+b.dataset.i]; form.manual = form.auto = false; form.from = p[0]; form.to = p[1]; again(); });
  const man = $('#man'); if (man) man.onclick = () => { form.manual = true; form.auto = false; form.from = form.to = ''; again(); };
  box.querySelectorAll('#ct .chip').forEach(b => b.onclick = () => { form.cashType = b.dataset.v; box.querySelectorAll('#ct .chip').forEach(x => x.classList.toggle('on', x === b)); });
  ['from', 'to', 'minutes', 'amount', 'comment'].forEach(id => { const el = $('#' + id); if (el) el.oninput = () => { form[id] = el.value; updEst(); }; });
  const sea = $('#sea'); if (sea) sea.onclick = () => { form.seattle = !form.seattle; sea.classList.toggle('on', form.seattle); updEst(); };
  const ph = $('#ph');
  if (ph) {
    ph.onclick = () => $('#phf').click();
    const px = $('#phx'); if (px) px.onclick = () => { form.photo = null; again(); };
    $('#phf').onchange = e => { const f = e.target.files[0]; if (f) shrink(f).then(p => { form.photo = p; again(); }).catch(() => toast(T.photoBig, true)); };
  }
  $('#save').onclick = () => save(code);
  updEst();
}
function updEst() {
  const el = $('#est'); if (!el || !S.rate) return;
  const m = parseInt(form.minutes, 10);
  if (!(m > 0)) { el.classList.add('hidden'); return; }
  let rate = S.rate.rate; const y27 = form.date >= '2027-01-01';
  if (form.seattle && S.rate.seattle) rate = y27 ? 22.14 : S.rate.seattle;
  else if (y27 && rate === 17.13) rate = 17.73;
  el.textContent = T.est(money(Math.max(m - S.rate.free, 0) * rate / 60), S.rate.free ? T.r1099(S.rate.free) : T.rW2);
  el.classList.remove('hidden');
}
// Сжимаем фото на телефоне до ~1600px — быстрее отправка
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res({ data: c.toDataURL('image/jpeg', 0.82).split(',')[1], mime: 'image/jpeg' });
    };
    img.onerror = rej; img.src = url;
  });
}
function save(code) {
  const miss = [];
  const amt = parseFloat(String(form.amount).replace(',', '.'));
  if (code === 'travel' || code === 'toll') { if (!form.from.trim()) miss.push(T.from); if (!form.to.trim()) miss.push(T.to); }
  if (code === 'travel') { if (!(parseInt(form.minutes, 10) > 0)) miss.push(T.minutes); }
  else if (!(amt > 0)) miss.push(T.amount);
  if (code === 'cash' && !form.cashType) miss.push(T.cashType);
  if (code === 'supplies' && !form.comment.trim()) miss.push(T.whatBought);
  if (miss.length) return toast(`${T.need}: ${miss.join(', ')}`, true);
  const btn = $('#save'); btn.disabled = true; btn.textContent = T.saving;
  const p = { date: form.date, catLabel: form.cat, client: form.client, from: form.from, to: form.to, minutes: form.minutes,
    seattle: S.seattle ? S.seattle[form.seattle ? 0 : 1] : '', amount: form.amount, cashType: form.cashType, comment: form.comment,
    photo: code === 'travel' ? null : form.photo };
  call('add', p).then(() => {
    const icon = code === 'cash' ? TICON[isCheck(form.cashType) ? 'check' : 'cash'] : ICON[code];
    const what = code === 'travel' ? `${form.from} → ${form.to}, ${form.minutes} ${T.min}${form.seattle ? ' · 🏙' : ''}`
      : `$${money(amt)}` + (code === 'toll' ? ` · ${form.from} → ${form.to}` : form.client ? ' · ' + form.client : '') + (form.cashType ? ' · ' + form.cashType : '');
    added.push(`${icon} ${short(form.date)} · ${form.cat} · ${what}`);
    resetForm(); toast(T.saved); viewAdd();
  }).catch(e => { toast(errMsg(e), true); btn.disabled = false; btn.textContent = T.save; });
}

function incomingHtml(list) {

function wireIncoming(after) {

let PAY = null; const paySel = { m: null, half: null };
function viewPay() {
  if (PAY) return renderPay();
  loading();
  call('pay').then(d => {
    if (!d.pay || !d.pay.months.length) { $('#view').innerHTML = `<div class="card empty">${T.noPay}</div>`; return; }
    PAY = d.pay; paySel.m = d.def.m; paySel.half = d.def.half;
    renderPay();
  }).catch(e => failed(e, viewPay));
}
function renderPay() {
  const P = PAY, month = P.months[paySel.m];
  const mc = P.cols.map((c, i) => ({ c: c, i: i })).filter(x => x.c.month === month);
  const pick = paySel.half ? mc.filter(x => x.c.half === paySel.half) : mc;
  const val = r => pick.reduce((s, x) => s + r.vals[x.i], 0);
  const payRow = P.rows.find(r => r.kind === 'pay');
  const totRow = P.rows.find(r => r.kind === 'total');
  const fmt = (k, n) => k === 'count' ? String(Math.round(n)) : k === 'hours' ? String(Math.round(n * 10) / 10) : usd(n);

  let h = `<div class="chips scroll" id="months">` + P.months.map((m, i) => `<button class="chip ${i === paySel.m ? 'on' : ''}" data-m="${i}">${esc(m)}</button>`).join('') + '</div>';
  h += `<div class="seg" id="halves">` + mc.map(x => `<button class="${paySel.half === x.c.half ? 'on' : ''}" data-h="${x.c.half}">${esc(x.c.label)}</button>`).join('') +
    `<button class="${!paySel.half ? 'on' : ''}" data-h="0">${T.month}</button></div>`;
  const per = paySel.half ? (pick[0] ? pick[0].c.label : '') : T.month.toLowerCase();
  h += `<div class="hero"><div class="lbl">${T.toPay} · ${esc(month)}, ${esc(per)}</div><div class="big">${usd(payRow ? val(payRow) : 0)}</div>` +
    (totRow ? `<div class="sub2">${esc(totRow.label)}: ${usd(val(totRow))}</div>` : '') + '</div>';

  // строки по разделам; нулевые прячем
  let body = '', sect = null, buf = '', ref = [];
  const flush = () => { if (buf) body += (sect ? `<h2>${esc(sect)}</h2>` : '') + `<div class="card">${buf}</div>`; buf = ''; };
  let inRef = false;
  P.rows.forEach(r => {
    if (r.kind === 'section') { flush(); sect = r.label; inRef = /Справочно|For reference/.test(r.label); return; }
    const n = val(r);
    if (inRef) { if (n && (r.kind === 'count' || r.kind === 'hours')) ref.push([r.label, fmt(r.kind, n)]); return; }
    if (!n || r.kind === 'pay') return;
    buf += `<div class="pl ${r.kind === 'total' ? 'total' : ''} ${n < 0 ? 'neg' : ''}"><span>${esc(r.label)}</span><span class="v">${fmt(r.kind, n)}</span></div>`;
  });
  flush();
  if (!body) body = `<div class="card empty">${T.payEmpty}</div>`;
  h += body;
  if (ref.length) h += `<h2>${T.ref}</h2><div class="card stat">` + ref.slice(0, 6).map(x => `<div><b>${esc(x[1])}</b><span>${esc(x[0])}</span></div>`).join('') + '</div>';

  // опоздания за месяц
  const late = P.late[month];
  h += `<h2>${T.lateT}</h2><div class="card late ${late && late.count ? '' : 'good'}">` +
    (late && late.count ? `<b>⏰ ${T.late(late.count, late.minutes)}</b>` +
      late.items.map(x => `<div class="pl"><span>${short(x.date)} · ${esc(x.client)}<br><small class="meta">${esc(x.plan)} → ${esc(x.fact)}</small></span><span class="v">+${x.min} ${T.min}</span></div>`).join('')
      : T.noLate) + '</div>';
  h += `<div class="hint" style="text-align:center">${T.payNote}</div>`;
  $('#view').innerHTML = h;
  document.querySelectorAll('#months .chip').forEach(b => b.onclick = () => { paySel.m = +b.dataset.m; renderPay(); });
  document.querySelectorAll('#halves button').forEach(b => b.onclick = () => { paySel.half = +b.dataset.h; renderPay(); });
  const on = $('#months .chip.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
}

      h += '</div>';
    });
    $('#view').innerHTML = h || `<div class="card empty">${T.handNobody}</div>`;
  }).catch(e => failed(e, viewOwnerHand));
}

// ── старт
function start() {
  loading();
  call('init').then(d => {
    S = d;
    if (d.lang && TT[d.lang]) T = TT[d.lang];
    $('#hello').textContent = d.name;
    if (d.admin) {
      const bar = $('#asbar'); bar.classList.remove('hidden');
      bar.innerHTML = `<select id="asSel"><option value="">👤 Kayadzi — админ</option>` +
        d.admin.names.map(n => `<option value="${esc(n)}" ${n === d.admin.as ? 'selected' : ''}>👁 Экран: ${esc(n)}</option>`).join('') + '</select>' +
        (d.admin.as ? `<div class="asnote">Всё, что внесёшь или передашь, запишется в таблицу ${esc(d.admin.as)}. Тестовые записи потом удали.</div>` : '');
      $('#asSel').onchange = e => { AS = e.target.value; PAY = null; resetForm(); added.length = 0; listOffset = 0; give.sel = []; start(); };
    }
    $('#hdrSub').textContent = short(d.today);
    go(d.owner ? 'confirm' : (d.pending && d.pending.length ? 'give' : 'add'));
  }).catch(e => failed(e, start));
}
start();
})();
</script>
