  table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.t th, table.t td { padding: 8px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  table.t th { color: var(--muted); font-weight: 600; background: var(--bg); position: sticky; top: 0; }
  table.t td.n { text-align: right; font-variant-numeric: tabular-nums; }
  table.t tr:last-child td { border-bottom: 0; }
  .linkbtn { display: block; text-align: center; margin: 12px 0 4px; color: var(--accent); text-decoration: none; font-weight: 600; }

const short = iso => iso ? iso.slice(5).replace('-', '/') : '';
const wday = iso => { const p = iso.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay(); };

let AS = '';   // админ: чей экран смотрим

function dateChips(days, cur, id) {

function clientsFor(date) {
  if (S.clients[date]) return Promise.resolve(S.clients[date]);
  return call('clients', { date: date }).then(r => (S.clients[date] = r.clients));
}
const pairsOf = cl => { const p = []; for (let i = 0; i + 1 < cl.length; i++) p.push([cl[i], cl[i + 1]]); return p; };

function viewAdd() {
  if (!form.date) form.date = S.today;
  const v = $('#view');
  const cat = S.cats.find(c => c.label === form.cat);

  let html = `<div class="card"><label class="f">${T.date}</label>${dateChips(S.days, form.date, 'dt')}`;
  html += `<label class="f">${T.what}</label><div class="chips" id="cats">` +
    S.cats.map(c => `<button class="chip ${c.label === form.cat ? 'on' : ''}" data-c="${esc(c.label)}">${ICON[c.code] || ''} ${esc(c.label)}</button>`).join('') + '</div></div>';

  if (added.length) html += `<h2>${T.justAdded}</h2>` + added.slice(-5).reverse().map(a => `<div class="card">${esc(a)}</div>`).join('');

    if (form.cat !== b.dataset.c) { form.cat = b.dataset.c; form.client = form.from = form.to = ''; form.manual = form.auto = false; }

function renderFields(code, clients) {

  if (code === 'parking') h = clientField() + amount() + comment() + photo();
  else if (code === 'toll') h = pairField() + amount() + comment() + photo();

  else if (code === 'cash') {
    h = clientField() + amount() + `<label class="f">${T.cashType}</label><div class="chips" id="ct">` +
      S.cashTypes.map(c => `<button class="chip ${c === form.cashType ? 'on' : ''}" data-v="${esc(c)}">${isCheck(c) ? TICON.check : TICON.cash} ${esc(c)}</button>`).join('') + '</div>' + comment() + photo();
  } else if (code === 'travel') {

    if (S.seattle) h += `<div class="toggle ${form.seattle ? 'on' : ''}" id="sea"><span class="sw"></span><span><b>${T.seaT}</b><small>${T.seaD}</small></span></div>`;

function wire(code, clients) {
  const box = $('#fields');
  const again = () => renderFields(code, clients);
  box.querySelectorAll('#cl .chip').forEach(b => b.onclick = () => { form.client = b.dataset.v; $('#client').value = ''; box.querySelectorAll('#cl .chip').forEach(x => x.classList.toggle('on', x === b)); });
  const cl = $('#client'); if (cl) cl.oninput = () => { form.client = cl.value; box.querySelectorAll('#cl .chip').forEach(x => x.classList.remove('on')); };
  const pairs = pairsOf(clients);
  box.querySelectorAll('#pairs .chip[data-i]').forEach(b => b.onclick = () => { const p = pairs[+b.dataset.i]; form.manual = form.auto = false; form.from = p[0]; form.to = p[1]; again(); });
  const man = $('#man'); if (man) man.onclick = () => { form.manual = true; form.auto = false; form.from = form.to = ''; again(); };
  box.querySelectorAll('#ct .chip').forEach(b => b.onclick = () => { form.cashType = b.dataset.v; box.querySelectorAll('#ct .chip').forEach(x => x.classList.toggle('on', x === b)); });
  ['from', 'to', 'minutes', 'amount', 'comment'].forEach(id => { const el = $('#' + id); if (el) el.oninput = () => { form[id] = el.value; updEst(); }; });
  const sea = $('#sea'); if (sea) sea.onclick = () => { form.seattle = !form.seattle; sea.classList.toggle('on', form.seattle); updEst(); };

    $('#phf').onchange = e => { const f = e.target.files[0]; if (f) shrink(f).then(p => { form.photo = p; again(); }).catch(() => toast(T.photoBig, true)); };
  }
  $('#save').onclick = () => save(code);

}
function updEst() {
  const el = $('#est'); if (!el || !S.rate) return;
  const m = parseInt(form.minutes, 10);
  if (!(m > 0)) { el.classList.add('hidden'); return; }
  let rate = S.rate.rate; const y27 = form.date >= '2027-01-01';
  if (form.seattle && S.rate.seattle) rate = y27 ? 22.14 : S.rate.seattle;
  else if (y27 && rate === 17.13) rate = 17.73;
  el.textContent = T.est(money(Math.max(m - S.rate.free, 0) * rate / 60), S.rate.free ? T.r1099(S.rate.free) : T.rW2);
  el.classList.remove('hidden');
}
// Сжимаем фото на телефоне до ~1600px — быстрее отправка
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res({ data: c.toDataURL('image/jpeg', 0.82).split(',')[1], mime: 'image/jpeg' });
    };
    img.onerror = rej; img.src = url;
  });
}
function save(code) {
  const miss = [];
  const amt = parseFloat(String(form.amount).replace(',', '.'));
  if (code === 'travel' || code === 'toll') { if (!form.from.trim()) miss.push(T.from); if (!form.to.trim()) miss.push(T.to); }
  if (code === 'travel') { if (!(parseInt(form.minutes, 10) > 0)) miss.push(T.minutes); }
  else if (!(amt > 0)) miss.push(T.amount);
  if (code === 'cash' && !form.cashType) miss.push(T.cashType);
  if (code === 'supplies' && !form.comment.trim()) miss.push(T.whatBought);
  if (miss.length) return toast(`${T.need}: ${miss.join(', ')}`, true);
  const btn = $('#save'); btn.disabled = true; btn.textContent = T.saving;
  const p = { date: form.date, catLabel: form.cat, client: form.client, from: form.from, to: form.to, minutes: form.minutes,
    seattle: S.seattle ? S.seattle[form.seattle ? 0 : 1] : '', amount: form.amount, cashType: form.cashType, comment: form.comment,
    photo: form.photo };
  call('add', p).then(() => {
    const icon = code === 'cash' ? TICON[isCheck(form.cashType) ? 'check' : 'cash'] : ICON[code];
    const what = code === 'travel' ? `${form.from} → ${form.to}, ${form.minutes} ${T.min}${form.seattle ? ' · 🏙' : ''}`
      : `$${money(amt)}` + (code === 'toll' ? ` · ${form.from} → ${form.to}` : form.client ? ' · ' + form.client : '') + (form.cashType ? ' · ' + form.cashType : '');
    added.push(`${icon} ${short(form.date)} · ${form.cat} · ${what}`);
    resetForm(); toast(T.saved); viewAdd();
  }).catch(e => { toast(errMsg(e), true); btn.disabled = false; btn.textContent = T.save; });
}

  const dp = $('#exdPick'); if (dp) dp.onchange = e => { if (e.target.value && e.target.value <= S.today) { ex.date = e.target.value; ex.client = ''; re(); } };
  c.querySelectorAll('#exr .chip').forEach(b => b.onclick = () => { ex.recv = b.dataset.v; ex.client = ''; re(); });
  c.querySelectorAll('#excl .chip').forEach(b => b.onclick = () => { ex.client = b.dataset.v; re(); });
  const ci = $('#exClient'); if (ci) ci.oninput = () => { ex.client = ci.value; c.querySelectorAll('#excl .chip').forEach(x => x.classList.remove('on')); };
  const am = $('#exAmount'); am.oninput = () => { ex.amount = am.value; };
  c.querySelectorAll('#exct .chip').forEach(b => b.onclick = () => { ex.cashType = b.dataset.v; re(); });
  c.querySelectorAll('#exto .chip').forEach(b => b.onclick = () => { ex.to = b.dataset.v; re(); });
  c.querySelectorAll('#exh .chip').forEach(b => b.onclick = () => { ex.handDate = b.dataset.d; re(); });
  const hp = $('#exhPick'); if (hp) hp.onchange = e => { if (e.target.value && e.target.value <= S.today) ex.handDate = e.target.value; };
  $('#exCancel').onclick = () => { Object.assign(ex, { open: false, date: null, recv: '', client: '', amount: '', cashType: '', to: '', handDate: null }); viewGive(); };
  $('#exSave').onclick = () => {
    const miss = [];
    if (!(parseFloat(String(ex.amount).replace(',', '.')) > 0)) miss.push(T.amount);
    if (!ex.cashType) miss.push(T.cashType);
    if (miss.length) return toast(`${T.need}: ${miss.join(', ')}`, true);
    const b = $('#exSave'); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
    call('addGive', { date: ex.date, recv: ex.recv, client: ex.recv === S.recvFrom[0] ? ex.client : '', amount: ex.amount, cashType: ex.cashType, to: ex.to, handDate: ex.handDate })
      .then(r => {
        toast(r.given ? (r.recipientLinked ? T.given(ex.to) : T.notLinked(ex.to)) : T.savedKept);
        Object.assign(ex, { open: false, date: null, recv: '', client: '', amount: '', cashType: '', to: '', handDate: null });
        viewGive();
      }).catch(e => { toast(errMsg(e), true); b.disabled = false; b.textContent = T.saveGive; });
  };
}

function incomingHtml(list) {

    `<div class="card"><b>${esc(tr.from)} → ${esc(tr.to)}</b> <span class="meta">${short(tr.date)}</span>` +

    `<div class="row2"><button class="btn small ok" data-a="${esc(tr.id)}" data-y="1">✅ ${T.got}</button><button class="btn small bad" data-a="${esc(tr.id)}" data-y="0">❌ ${T.notGot}</button></div></div>`).join('');
}
function wireIncoming(after) {

}

// ═════ 📋 Траты ═════
let listOffset = 0, listMode = 'cards';
function viewList() {
  loading();
  call('list', { offset: listOffset }).then(d => {
    let h = `<div class="per"><button id="pv">‹</button><b>${esc(d.label)}</b><button id="nx" ${listOffset >= 0 ? 'disabled' : ''}>›</button></div>`;
    h += `<div class="seg" id="lm"><button class="${listMode === 'cards' ? 'on' : ''}" data-m="cards">${T.viewCards}</button><button class="${listMode === 'table' ? 'on' : ''}" data-m="table">${T.viewTable}</button></div>`;
    if (!d.items.length) h += `<div class="card empty">${T.empty}</div>`;
    if (listMode === 'table' && d.items.length) {
      h += `<div class="tblwrap"><table class="t"><tr><th>${T.thDate}</th><th>${T.thWhat}</th><th>${T.thWho}</th><th class="n">${T.thSum}</th><th>${T.thSt}</th></tr>` +
        d.items.map(it => {
          const icon = it.code === 'cash' ? TICON[isCheck(it.cashType) ? 'check' : 'cash'] : (ICON[it.code] || '');
          const who = (it.code === 'travel' || it.code === 'toll') ? `${it.client || '?'} → ${it.to || '?'}` : it.client;
          const sum = it.code === 'travel' ? `${it.minutes} ${T.min}${it.travelPay ? ' · $' + money(it.travelPay) : ''}` : '$' + money(it.amount);
          return `<tr><td>${short(it.date)}</td><td>${icon} ${esc(it.code === 'cash' ? it.cashType : it.cat)}</td><td>${esc(who)}</td><td class="n">${esc(sum)}</td><td><span class="pill ${it.status}">${T.st[it.status]}</span></td></tr>`;
        }).join('') + '</table></div>';
    }
    if (listMode === 'cards') d.items.forEach(it => {
      let line, amt = '', icon = ICON[it.code] || '•';
      if (it.code === 'travel') { line = `${esc(it.client || '?')} → ${esc(it.to || '?')} · ${it.minutes} ${T.min}`; amt = it.travelPay ? '$' + money(it.travelPay) : ''; }
      else if (it.code === 'cash') {
        icon = TICON[isCheck(it.cashType) ? 'check' : 'cash'];
        line = `${esc(it.cashType)}${it.client ? ' · ' + esc(it.client) : ''}${it.handed ? ' → ' + esc(it.handed) : ''}${it.conf ? ' ' + esc(it.conf.split(' ')[0]) : ''}`;
        amt = '$' + money(it.amount);
      } else if (it.code === 'toll') { line = `${esc(it.cat)}${it.client ? ' · ' + esc(it.client) : ''}${it.to ? ' → ' + esc(it.to) : ''}`; amt = '$' + money(it.amount); }
      else { line = `${esc(it.cat)}${it.client ? ' · ' + esc(it.client) : ''}`; amt = '$' + money(it.amount); }
      h += `<div class="card item"><div class="ico">${icon}</div><div class="body">
        <div class="top"><span>${line}</span><span class="amt">${amt}</span></div>
        <div class="top meta"><span>${short(it.date)}${it.comment ? ' · ' + esc(it.comment) : ''}${it.photo ? ` · <a href="${esc(it.photo)}" target="_blank">📷</a>` : ''}</span>
        <span><span class="pill ${it.status}">${T.st[it.status]}</span>${it.deletable ? ` <button class="del" data-row="${it.row}" data-sig="${esc(it.sig)}">🗑</button>` : ''}</span></div>
        ${it.office ? `<div class="office">💬 ${T.office}: ${esc(it.office)}</div>` : ''}</div></div>`;
    });
    if (d.items.length) {
      const t = d.totals;
      h += `<h2>${T.totals}</h2><div class="card">` +
        `<div class="tot"><span>${T.reimb}</span><b>$${money(t.reimb)}</b></div><div class="tot"><span>${T.travelPay}</span><b>$${money(t.travel)}</b></div>` +
        (t.cash ? `<div class="tot"><span>${TICON.cash} ${T.cashGot}</span><b>$${money(t.cash)}</b></div>` : '') +
        (t.check ? `<div class="tot"><span>${TICON.check} ${T.checkGot}</span><b>$${money(t.check)}</b></div>` : '') +
        (t.pending ? `<div class="tot"><span>${T.pendingN}</span><b>${t.pending}</b></div>` : '') + '</div>';
    }
    if (S.sheetUrl) h += `<a class="linkbtn" href="${esc(S.sheetUrl)}" target="_blank" id="sheetLink">${T.mySheet}</a>`;
    const v = $('#view'); v.innerHTML = h;
    v.querySelectorAll('#lm button').forEach(b => b.onclick = () => { listMode = b.dataset.m; viewList(); });
    const sl = $('#sheetLink'); if (sl && TG && TG.openLink) sl.onclick = e => { e.preventDefault(); TG.openLink(S.sheetUrl); };
    $('#pv').onclick = () => { listOffset--; viewList(); };
    $('#nx').onclick = () => { if (listOffset < 0) { listOffset++; viewList(); } };
    v.querySelectorAll('.del[data-row]').forEach(b => b.onclick = () => {
      if (!confirm(T.delQ)) return;
      call('del', { row: +b.dataset.row, sig: b.dataset.sig }).then(r => { toast(r.ok ? T.deleted : T.delGone, !r.ok); viewList(); }).catch(e => toast(errMsg(e), true));
    });

}

// ═════ 💵 Выплата ═════
let PAY = null; const paySel = { m: null, half: null };
function viewPay() {
  if (PAY) return renderPay();
  loading();
  call('pay').then(d => {
    if (!d.pay || !d.pay.months.length) { $('#view').innerHTML = `<div class="card empty">${T.noPay}</div>`; return; }
    PAY = d.pay; paySel.m = d.def.m; paySel.half = d.def.half;
    renderPay();
  }).catch(e => failed(e, viewPay));
}
function renderPay() {
  const P = PAY, month = P.months[paySel.m];
  const mc = P.cols.map((c, i) => ({ c: c, i: i })).filter(x => x.c.month === month);
  const pick = paySel.half ? mc.filter(x => x.c.half === paySel.half) : mc;
  const val = r => pick.reduce((s, x) => s + r.vals[x.i], 0);
  const payRow = P.rows.find(r => r.kind === 'pay');
  const totRow = P.rows.find(r => r.kind === 'total');
  const fmt = (k, n) => k === 'count' ? String(Math.round(n)) : k === 'hours' ? String(Math.round(n * 10) / 10) : usd(n);

  let h = `<div class="chips scroll" id="months">` + P.months.map((m, i) => `<button class="chip ${i === paySel.m ? 'on' : ''}" data-m="${i}">${esc(m)}</button>`).join('') + '</div>';
  h += `<div class="seg" id="halves">` + mc.map(x => `<button class="${paySel.half === x.c.half ? 'on' : ''}" data-h="${x.c.half}">${esc(x.c.label)}</button>`).join('') +
    `<button class="${!paySel.half ? 'on' : ''}" data-h="0">${T.month}</button></div>`;
  const per = paySel.half ? (pick[0] ? pick[0].c.label : '') : T.month.toLowerCase();
  h += `<div class="hero"><div class="lbl">${T.toPay} · ${esc(month)}, ${esc(per)}</div><div class="big">${usd(payRow ? val(payRow) : 0)}</div>` +
    (totRow ? `<div class="sub2">${esc(totRow.label)}: ${usd(val(totRow))}</div>` : '') + '</div>';

  // строки по разделам; нулевые прячем
  let body = '', sect = null, buf = '', ref = [];
  const flush = () => { if (buf) body += (sect ? `<h2>${esc(sect)}</h2>` : '') + `<div class="card">${buf}</div>`; buf = ''; };
  let inRef = false;
  P.rows.forEach(r => {
    if (r.kind === 'section') { flush(); sect = r.label; inRef = /Справочно|For reference/.test(r.label); return; }
    const n = val(r);
    if (inRef) { if (n && (r.kind === 'count' || r.kind === 'hours')) ref.push([r.label, fmt(r.kind, n)]); return; }
    if (!n || r.kind === 'pay') return;
    buf += `<div class="pl ${r.kind === 'total' ? 'total' : ''} ${n < 0 ? 'neg' : ''}"><span>${esc(r.label)}</span><span class="v">${fmt(r.kind, n)}</span></div>`;
  });
  flush();
  if (!body) body = `<div class="card empty">${T.payEmpty}</div>`;
  h += body;
  if (ref.length) h += `<h2>${T.ref}</h2><div class="card stat">` + ref.slice(0, 6).map(x => `<div><b>${esc(x[1])}</b><span>${esc(x[0])}</span></div>`).join('') + '</div>';

  // опоздания за месяц
  const late = P.late[month];
  h += `<h2>${T.lateT}</h2><div class="card late ${late && late.count ? '' : 'good'}">` +
    (late && late.count ? `<b>⏰ ${T.late(late.count, late.minutes)}</b>` +
      late.items.map(x => `<div class="pl"><span>${short(x.date)} · ${esc(x.client)}<br><small class="meta">${esc(x.plan)} → ${esc(x.fact)}</small></span><span class="v">+${x.min} ${T.min}</span></div>`).join('')
      : T.noLate) + '</div>';
  h += `<div class="hint" style="text-align:center">${T.payNote}</div>`;
  $('#view').innerHTML = h;
  document.querySelectorAll('#months .chip').forEach(b => b.onclick = () => { paySel.m = +b.dataset.m; renderPay(); });
  document.querySelectorAll('#halves button').forEach(b => b.onclick = () => { paySel.half = +b.dataset.h; renderPay(); });
  const on = $('#months .chip.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
}

// ═════ Админ: ✅ Проверка ═════
const rv = { cat: 'all', who: 'all', items: null, unsynced: {} };
function itemText(it) {
  const sum = it.amount ? '$' + money(it.amount) : '';
  if (it.code === 'travel') return `${it.client || '?'} → ${it.place || '?'} · ${it.minutes} ${T.min}${it.seattle === 'Да' ? ' · 🏙' : ''}${it.pay ? ' = ' + it.pay : ''}`;
  if (it.code === 'toll') return `${sum}${it.client ? ' · ' + it.client : ''}${it.place ? ' → ' + it.place : ''}`;
  if (it.code === 'cash') return `${it.kind} ${sum}${it.client ? ' · ' + it.client : ''} · ${it.from || '?'}${it.to ? ' → ' + it.to : ''}`;
  return `${sum}${it.client ? ' · ' + it.client : ''}`;
}
function viewReview() {
  loading();
  call('review').then(d => { rv.items = d.items; rv.unsynced = d.unsynced || {}; renderReview(); }).catch(e => failed(e, viewReview));
}
function renderReview() {
  const items = rv.items || [];
  const cats = {}, who = {};
  items.forEach(i => { cats[i.code] = cats[i.code] || { n: 0, label: i.cat }; cats[i.code].n++; who[i.cleaner] = (who[i.cleaner] || 0) + 1; });
  if (rv.cat !== 'all' && !cats[rv.cat]) rv.cat = 'all';
  if (rv.who !== 'all' && !who[rv.who]) rv.who = 'all';
  const shown = items.filter(i => (rv.cat === 'all' || i.code === rv.cat) && (rv.who === 'all' || i.cleaner === rv.who));
  let h = '';
  const un = Object.keys(rv.unsynced);
  if (un.length) h += `<div class="note" style="margin:0 0 10px">⏳ ${T.unsynced} ${un.map(k => `${esc(k)} ${rv.unsynced[k]}`).join(', ')}</div>`;
  if (!items.length) { $('#view').innerHTML = h + `<div class="card empty">${T.allReviewed}</div>`; return; }
  h += `<div class="chips scroll" id="rvc"><button class="chip ${rv.cat === 'all' ? 'on' : ''}" data-v="all">${T.all} <small>${items.length}</small></button>` +
    Object.keys(cats).map(c => `<button class="chip ${rv.cat === c ? 'on' : ''}" data-v="${c}">${ICON[c] || ''} ${esc(cats[c].label)} <small>${cats[c].n}</small></button>`).join('') + '</div>';
  h += `<div class="chips scroll" id="rvw" style="margin-top:8px"><button class="chip ${rv.who === 'all' ? 'on' : ''}" data-v="all">👥 ${T.all}</button>` +
    Object.keys(who).map(w => `<button class="chip ${rv.who === w ? 'on' : ''}" data-v="${esc(w)}">${esc(w)} <small>${who[w]}</small></button>`).join('') + '</div>';
  if (shown.length > 1) h += `<button class="btn ghost" id="rvAll" style="margin:12px 0 10px">${T.approveAll(shown.length)}</button>`;
  else h += '<div style="height:10px"></div>';
  shown.forEach(it => {
    const icon = it.code === 'cash' ? TICON[isCheck(it.kind) ? 'check' : 'cash'] : (ICON[it.code] || '•');
    h += `<div class="card" data-row="${it.row}"><div class="item"><div class="ico">${icon}</div><div class="body">
      <div class="top"><b>${esc(it.cleaner)}</b><span class="meta">${short(it.date)} · ${esc(it.cat)}</span></div>
      <div>${esc(itemText(it))}</div>
      ${it.comment ? `<div class="meta">💬 ${esc(it.comment)}</div>` : ''}
      ${it.photo ? `<div class="meta"><a href="${esc(it.photo)}" target="_blank" class="ph">📷 фото</a></div>` : ''}
      ${it.koala ? `<div class="meta">${T.koala}: ${esc(it.koala)}${it.found ? ` · ${T.found}: ${esc(it.found)}` : ''}</div>` : ''}
      </div></div>
      <div class="row2" style="margin-top:10px"><button class="btn small ok" data-ok="${it.row}">${T.approve}</button><button class="btn small bad" data-no="${it.row}">${T.reject}</button></div>
      <div class="hidden rj" style="margin-top:10px"><input type="text" placeholder="${T.reason}"><button class="btn small bad" data-nogo="${it.row}" style="margin-top:8px;width:100%">${T.rejectDo}</button></div></div>`;
  });
  const v = $('#view'); v.innerHTML = h;
  v.querySelectorAll('#rvc .chip').forEach(b => b.onclick = () => { rv.cat = b.dataset.v; renderReview(); });
  v.querySelectorAll('#rvw .chip').forEach(b => b.onclick = () => { rv.who = b.dataset.v; renderReview(); });
  v.querySelectorAll('a.ph').forEach(a => { if (TG && TG.openLink) a.onclick = e => { e.preventDefault(); TG.openLink(a.href); }; });
  const byRow = r => items.find(i => i.row === +r);
  const decide = (list, ok, note, btn) => {
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
    call('decide', { items: list.map(i => ({ row: i.row, sig: i.sig })), ok: ok, note: note || '' }).then(r => {
      const rows = list.map(i => i.row);
      rv.items = rv.items.filter(i => rows.indexOf(i.row) < 0);
      toast(ok ? T.approved + (list.length > 1 ? ` · ${r.done}` : '') : T.rejectedOk);
      renderReview();
    }).catch(e => { toast(errMsg(e), true); viewReview(); });
  };
  v.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => decide([byRow(b.dataset.ok)], true, '', b));
  v.querySelectorAll('[data-no]').forEach(b => b.onclick = () => { const box = b.closest('.card').querySelector('.rj'); box.classList.toggle('hidden'); const i = box.querySelector('input'); if (i) i.focus(); });
  v.querySelectorAll('[data-nogo]').forEach(b => b.onclick = () => decide([byRow(b.dataset.nogo)], false, b.closest('.rj').querySelector('input').value, b));
  const all = $('#rvAll'); if (all) all.onclick = () => { if (confirm(T.approveAllQ(shown.length))) decide(shown, true, '', all); };
}

// ═════ Админ: 📰 Лента ═════

    h += `<div class="chips scroll" id="fdw"><button class="chip ${fd.who === 'all' ? 'on' : ''}" data-v="all">👥 ${T.all} <small>${items.length}</small></button>` +
      Object.keys(who).map(w => `<button class="chip ${fd.who === w ? 'on' : ''}" data-v="${esc(w)}">${esc(w)} <small>${who[w]}</small></button>`).join('') + '</div><div style="height:10px"></div>';

    let lastDate = '';
    shown.forEach(it => {

      let line, amt = '', icon = ICON[it.code] || '•';
      if (it.code === 'travel') { line = `${esc(it.client || '?')} → ${esc(it.to || '?')} · ${it.minutes} ${T.min}`; amt = it.travelPay ? '$' + money(it.travelPay) : ''; }
      else if (it.code === 'cash') { icon = TICON[isCheck(it.cashType) ? 'check' : 'cash']; line = `${esc(it.cashType)}${it.client ? ' · ' + esc(it.client) : ''}${it.handed ? ' → ' + esc(it.handed) : ''}`; amt = '$' + money(it.amount); }
      else { line = `${esc(it.cat)}${it.client ? ' · ' + esc(it.client) : ''}${it.code === 'toll' && it.to ? ' → ' + esc(it.to) : ''}`; amt = '$' + money(it.amount); }
      h += `<div class="card item"><div class="ico">${icon}</div><div class="body"><div class="top"><span><b>${esc(it.cleaner)}</b> · ${line}</span><span class="amt">${amt}</span></div>
        <div class="top meta"><span>${short(it.date)}${it.comment ? ' · ' + esc(it.comment) : ''}</span><span class="pill ${it.status}">${T.st[it.status]}</span></div></div></div>`;

    v.querySelectorAll('#fdw .chip').forEach(b => b.onclick = () => { fd.who = b.dataset.v; viewFeed(); });
    const pv = $('#fpv'); if (pv) pv.onclick = () => { fd.offset--; viewFeed(); };
    const nx = $('#fnx'); if (nx) nx.onclick = () => { if (fd.offset < 0) { fd.offset++; viewFeed(); } };
  }).catch(e => failed(e, viewFeed));
}

// ═════ Админ: 💵 Выплаты всем ═════
let PA = null; const pa = { ym: null, half: null };
function viewPayAll() {
  if (PA) return renderPayAll();
  loading();
  call('payAll').then(d => { PA = d.people; renderPayAll(); }).catch(e => failed(e, viewPayAll));
}
function renderPayAll() {
  const yms = [];
  PA.forEach(p => p.cols.forEach(c => { if (c.ym && yms.indexOf(c.ym) < 0) yms.push(c.ym); }));
  yms.sort();
  if (!yms.length) { $('#view').innerHTML = `<div class="card empty">${T.noPay}</div>`; return; }
  if (!pa.ym || yms.indexOf(pa.ym) < 0) {
    const cur = S.today.slice(0, 7);
    pa.ym = yms.indexOf(cur) >= 0 ? cur : yms[yms.length - 1];
    pa.half = Number(S.today.slice(8)) <= 15 ? 1 : 2;
  }
  const mName = ym => T.monthsRu[Number(ym.slice(5)) - 1] + ' ' + ym.slice(0, 4);
  let label2 = '';
  const rows = PA.map(p => {
    const cs = p.cols.filter(c => c.ym === pa.ym && (!pa.half || c.half === pa.half));
    if (pa.half && cs[0]) label2 = cs[0].label;
    return { name: p.name, e: cs.reduce((s, c) => s + c.earned, 0), d: cs.reduce((s, c) => s + c.ded, 0), p: cs.reduce((s, c) => s + c.pay, 0) };
  });
  const tot = rows.reduce((a, r) => ({ e: a.e + r.e, d: a.d + r.d, p: a.p + r.p }), { e: 0, d: 0, p: 0 });
  let h = `<div class="chips scroll" id="pam">` + yms.map(y => `<button class="chip ${y === pa.ym ? 'on' : ''}" data-v="${y}">${mName(y)}</button>`).join('') + '</div>';
  h += `<div class="seg" id="pah"><button class="${pa.half === 1 ? 'on' : ''}" data-h="1">1–15</button><button class="${pa.half === 2 ? 'on' : ''}" data-h="2">16–${label2 && pa.half === 2 ? label2.split('–')[1] : '…'}</button><button class="${!pa.half ? 'on' : ''}" data-h="0">${T.month}</button></div>`;
  h += `<div class="hero"><div class="lbl">${T.pay} · ${mName(pa.ym)}${pa.half ? ', ' + esc(label2) : ''}</div><div class="big">${usd(tot.p)}</div><div class="sub2">${T.earned}: ${usd(tot.e)}${tot.d ? ' · ' + T.ded + ': ' + usd(tot.d) : ''}</div></div>`;
  h += `<div class="tblwrap"><table class="t"><tr><th>${T.cleaner}</th><th class="n">${T.earned}</th><th class="n">${T.ded}</th><th class="n">${T.pay}</th></tr>` +
    rows.map(r => `<tr><td><a href="#" data-p="${esc(r.name)}" style="color:var(--accent);text-decoration:none;font-weight:600">${esc(r.name)}</a></td><td class="n">${usd(r.e)}</td><td class="n" style="color:${r.d ? 'var(--bad)' : 'inherit'}">${r.d ? usd(r.d) : '—'}</td><td class="n"><b>${usd(r.p)}</b></td></tr>`).join('') +
    `<tr><td><b>${T.total}</b></td><td class="n"><b>${usd(tot.e)}</b></td><td class="n"><b>${tot.d ? usd(tot.d) : '—'}</b></td><td class="n"><b>${usd(tot.p)}</b></td></tr></table></div>`;
  h += `<div class="hint" style="text-align:center">${T.openPay}. ${T.payNote}</div>`;
  const v = $('#view'); v.innerHTML = h;
  v.querySelectorAll('#pam .chip').forEach(b => b.onclick = () => { pa.ym = b.dataset.v; renderPayAll(); });
  v.querySelectorAll('#pah button').forEach(b => b.onclick = () => { pa.half = +b.dataset.h; renderPayAll(); });
  v.querySelectorAll('[data-p]').forEach(a => a.onclick = e => { e.preventDefault(); AS = a.dataset.p; PAY = null; tab = 'pay'; startAs('pay'); });
  const on = $('#pam .chip.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
}

// ── старт
function startAs(tabAfter) { start(tabAfter); }
function start(tabAfter) {
  loading();
  call('init').then(d => {
    S = d;
    if (d.lang && TT[d.lang]) T = TT[d.lang];
    $('#hello').textContent = d.name;
    if (d.admin) {
      const bar = $('#asbar'); bar.classList.remove('hidden');
      bar.innerHTML = `<select id="asSel"><option value="">👤 Kayadzi — админ</option>` +
        d.admin.names.map(n => `<option value="${esc(n)}" ${n === d.admin.as ? 'selected' : ''}>👁 Экран: ${esc(n)}</option>`).join('') + '</select>' +
        (d.admin.as ? `<div class="asnote">Всё, что внесёшь или передашь, запишется в таблицу ${esc(d.admin.as)}. Тестовые записи потом удали.</div>` : '');
      $('#asSel').onchange = e => { AS = e.target.value; PAY = null; PA = null; resetForm(); added.length = 0; listOffset = 0; give.sel = []; start(); };
    }
    $('#hdrSub').textContent = short(d.today);
    go(tabAfter || (d.owner ? (d.isAdmin ? 'review' : 'confirm') : (d.pending && d.pending.length ? 'give' : 'add')));
  }).catch(e => failed(e, start));
}
start();
})();
</script>
